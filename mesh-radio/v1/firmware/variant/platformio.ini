; OffGrid Devices Mesh Radio v1 (working name): nRF52840 + SX1262 + QPA9510 (~3 W) + LNA.
; Lives in mesh-radio/v1/firmware/variant/ until it goes upstream; copy it to
; variants/nrf52840/offgrid_mesh_radio_v1/ in a Meshtastic checkout (pinned: v2.7.26.54e0d8d).
; Build: pio run -e offgrid_mesh_radio_v1          (see mesh-radio/v1/firmware/README.md)
;
; Board JSON: reuses wiscore_rak4631 (same nRF52840-QIAA, S140 6.1.1, same flash
; layout and Adafruit bootloader).  It also reuses RAK's USB VID/PID in the app's USB
; descriptor; a production build needs its own PID and board JSON.
[env:offgrid_mesh_radio_v1]
extends = nrf52840_base
board = wiscore_rak4631
board_level = extra
board_check = true
build_type = release
build_flags = ${nrf52840_base.build_flags}
  -I variants/nrf52840/offgrid_mesh_radio_v1
  -D OFFGRID_MESH_RADIO_V1
  -D PRIVATE_HW
  -DRADIOLIB_EXCLUDE_SX128X=1
  -DRADIOLIB_EXCLUDE_SX127X=1
  -DRADIOLIB_EXCLUDE_LR11X0=1
  ; Options (see variant.h):
  ;   -D OFFGRID_PA_ALLOW_4V0=1        licensed mode runs the amplifier at 4.0 V (~35 dBm); known-good antenna only
  ;   -D OFFGRID_LNA_BYPASS=1          receive amplifier always bypassed (battery saver)
  ;   -D OFFGRID_DRONE_SERIAL_DEFAULT=0  do not default the drone-port serial module on (needs patch 0001 to matter)
  ;   power caps, antenna-detector thresholds, charging window: the OFFGRID_* defaults in variant.h
  ; Patch 0001 part 3 is needed for the per-packet power caps and the missing-antenna cut-off.
build_src_filter = ${nrf52_base.build_src_filter} \
  +<../variants/nrf52840/offgrid_mesh_radio_v1> \
  +<mesh/api/>
lib_deps =
  ${nrf52840_base.lib_deps}
upload_protocol = nrfutil
