<!doctype html>
<html><head><meta charset="utf-8">
<!-- Concept render. Fonts come from ridge-3/fonts (branch claude/fpv-stack-3in). Render: chromium --headless --screenshot -->
<style>
@font-face{font-family:IS;src:url(../../ridge-3/fonts/InstrumentSans-VariableFont.ttf);}
@font-face{font-family:JB;src:url(../../ridge-3/fonts/JetBrainsMono-VariableFont.ttf);}
html,body{margin:0;background:#d9d4c8;}
svg{display:block}
.s{font-family:IS;font-weight:500;fill:#F1ECE0;letter-spacing:.01em}
.m{font-family:JB;font-weight:500;fill:#F1ECE0;letter-spacing:.06em}
.dim{font-family:IS;font-weight:500;fill:#5b5650;font-size:2.2px}
</style></head><body>
<!-- 1 user unit = 1 mm. Board 84 x 54 mm, XT60 + XT30 each end, seen from above; battery enters left, drone leaves right -->
<svg width="1700" height="1150" viewBox="-12 -10 108 72">
  <!-- cables, for orientation only -->
  <rect x="-12" y="18" width="12" height="3.2" rx="1.6" fill="#b5302b"/>
  <rect x="-12" y="25" width="12" height="3.2" rx="1.6" fill="#222"/>
  <rect x="84" y="18" width="12" height="3.2" rx="1.6" fill="#b5302b"/>
  <rect x="84" y="25" width="12" height="3.2" rx="1.6" fill="#222"/>
  <text class="dim" x="-11.5" y="16">to battery</text>
  <text class="dim" x="84.5" y="16">to drone</text>
  <text class="dim" x="0" y="-6">Firebreak concept faceplate, 84 x 54 mm, XT60 + XT30 each end, top view (concept, not the final layout)</text>

  <!-- board -->
  <rect x="0" y="0" width="84" height="54" rx="4" fill="#1B1813"/>

  <!-- display window -->
  <rect x="5" y="5" width="31" height="18" rx="1.2" fill="none" stroke="#F1ECE0" stroke-width="0.2"/>
  <rect x="6.2" y="6.2" width="28.6" height="15.6" rx="0.6" fill="#0b0b0b"/>
  <text class="m" x="8" y="11.6" font-size="3.2" style="fill:#9fe0a0">16.8V  4S</text>
  <text class="m" x="8" y="16" font-size="2.4" style="fill:#9fe0a0">IDLE 0.42A  OK</text>
  <text class="m" x="8" y="19.8" font-size="1.9" style="fill:#9fe0a0">AUTO 2.0A · DRONE 3</text>

  <!-- Bind button -->
  <circle cx="9.5" cy="30.5" r="3.4" fill="#2a2620" stroke="#4a443b" stroke-width="0.3"/>
  <text class="s" x="14.6" y="30" font-size="2.3">Bind</text>
  <text class="s" x="14.6" y="32.7" font-size="1.7">3 quick power cycles</text>
  <!-- Limit button -->
  <circle cx="9.5" cy="40.5" r="3.4" fill="#2a2620" stroke="#4a443b" stroke-width="0.3"/>
  <text class="s" x="14.6" y="40" font-size="2.3">Limit</text>
  <text class="m" x="14.6" y="42.7" font-size="1.5">AUTO 1A 2A 5A 10A 20A</text><text class="s" x="14.6" y="44.6" font-size="1.4">20A: props off</text>

  <!-- Beacon Ring power button -->
  <g transform="translate(64,16.5)">
    <circle r="11.2" fill="none" stroke="#F1ECE0" stroke-width="0.2" stroke-dasharray="0.6 0.6"/>
    <path d="M 3.4 -8.3 A 9 9 0 1 1 -3.4 -8.3" fill="none" stroke="#FF6A00" stroke-width="2.2" stroke-linecap="round"/>
    <circle cx="0" cy="-10.3" r="1.7" fill="#FF6A00"/>
    <circle r="5.6" fill="#2a2620" stroke="#4a443b" stroke-width="0.3"/>
    <text class="s" x="0" y="0.9" font-size="2.6" text-anchor="middle">Power</text>
  </g>
  <text class="s" x="64" y="31.4" font-size="1.9" text-anchor="middle">Press: check, then power on</text>
  <text class="s" x="64" y="34" font-size="1.9" text-anchor="middle">Press again: off</text>

  <!-- ring colour legend -->
  <g font-size="1.7">
    <circle cx="44.6" cy="38.4" r="0.8" fill="#F1ECE0"/><text class="s" x="46.2" y="39">Checking</text>
    <circle cx="63.6" cy="38.4" r="0.8" fill="#4caf50"/><text class="s" x="65.2" y="39">On, safe</text>
    <circle cx="44.6" cy="41.6" r="0.8" fill="#FF6A00"/><text class="s" x="46.2" y="42.2">Higher draw</text>
    <circle cx="63.6" cy="41.6" r="0.8" fill="#e53935"/><text class="s" x="65.2" y="42.2">Stopped</text>
  </g>

  <!-- steps -->
  <line x1="5" y1="46.2" x2="79" y2="46.2" stroke="#F1ECE0" stroke-width="0.15"/>
  <text class="s" x="5" y="50" font-size="1.9">1  Battery in</text><text class="s" x="21" y="50" font-size="1.9">2  Drone in</text><text class="s" x="36" y="50" font-size="1.9">3  Press Power</text>

  <!-- lockup -->
  <g transform="translate(65.6,47.3) scale(0.024)">
    <path d="M124.5 55.4 A58 58 0 1 1 75.5 55.4" fill="none" stroke="#F1ECE0" stroke-width="22" stroke-linecap="round"/>
    <circle cx="100" cy="40" r="17" fill="#F1ECE0"/>
  </g>
  <text x="71" y="50.3" font-family="IS" font-weight="600" font-size="3.1" fill="#F1ECE0" letter-spacing="-0.1">OffGrid</text>

  <text class="s" x="1.4" y="17" font-size="1.7">In</text>
  <text class="s" x="79.4" y="17" font-size="1.7">Out</text>
</svg>
</body></html>
