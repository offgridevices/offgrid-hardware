; Print Hub v1 firmware: ESP32-S3-WROOM-1 (8 MB flash), Arduino core 3.3.12
; through pioarduino's platform release 55.03.312-1 (pinned by URL; its zip's
; sha256 is f147d4ec6d657f451742df497811ebe3377db583ffd2e321e34b3793ff6b20a2).
;
;   pio run                      build
;   pio run -t upload            flash over the USB-C DATA port
;   make -C test                 host tests of the port logic (no board)
[env:printhub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
; native USB (GPIO19/20) is the serial console and the flashing port
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DPRINTHUB_VERSION=\"1.1.0\"
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.2
