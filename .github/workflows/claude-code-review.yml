name: Claude Code Review

# Every pull request goes through two stages, in this order:
#
#   1. `ci`     — ci.yml, called directly as a reusable workflow: rebuild every
#                 board from `src/`, run every verification gate, and check the
#                 committed Gerbers are byte-identical to the rebuild.
#   2. `review` — Claude reads the diff, the codebase and the CI output, may
#                 run the generator and write throwaway probe scripts in its own
#                 checkout, and leaves line-by-line comments.
#
# `review` has `needs: ci`, so a red suite stops the pull request at stage 1 and
# no paid review runs. Fix it, push, and both stages run again on the new commit.
#
# `synchronize` is what makes this iterative: push a fix and both stages run
# again against the new head, so findings get re-checked until they stop coming
# back. It does not fix anything on its own.
#
# This repository is public. Fork PRs get CI but never the review: the review
# job holds `id-token: write` and runs the PR's own Python.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# One run per pull request. Pushing three commits in a minute would otherwise
# start three paid runs racing each other; now the newest wins and the rest are
# cancelled before they cost anything.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  review:
    needs: ci
    # 2 vCPU for the free-plan allowance; see the note in ci.yml.
    runs-on: blacksmith-2vcpu-ubuntu-2404

    # Drafts are work in progress by definition; reviewing every intermediate
    # push is noise and cost. Marking ready fires `ready_for_review`, which is
    # in the trigger list above and re-runs both stages. Dependabot is guarded
    # in advance so it does not quietly start paying for lockfile churn, and
    # fork PRs never reach the paid, token-holding job.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository

    # Backstop so a hung run fails in the low tens of minutes rather than
    # sitting on GitHub's default 6-hour job ceiling with a paid model attached.
    timeout-minutes: 30

    permissions:
      contents: read
      pull-requests: write
      # **Required, and not an over-broad grant.** The action mints its GitHub
      # token by exchanging an OIDC token, so without this it fails before it
      # reads a single line: "Could not fetch an OIDC token". Removing it on the
      # theory that a reviewer only needs to comment is the mistake that breaks
      # this file.
      id-token: write
      # Lets Claude read CI results (checks, run logs) on the PR.
      actions: read

    steps:
      # Pinned to a commit rather than a tag. A tag is mutable, and whoever
      # controls it controls what runs in this repository with a token in
      # scope. This is `actions/checkout` v7.0.1.
      #
      # `ref` pins the review to the exact SHA CI just passed on, even if the
      # PR branch moves on while this job is starting.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history rather than a shallow clone, so `git log` and
          # `git blame` work. The review is markedly better when it can see why
          # a line came to be the way it is, not only that it changed.
          fetch-depth: 0
          # This job holds `id-token: write` for every step, and Claude may run
          # the PR's own Python below. Persisting the checkout's GITHUB_TOKEN
          # into `.git/config` on top of that would hand that code a second
          # credential. The action re-authenticates itself independently.
          persist-credentials: false

      # Same toolchain as ci.yml, so Claude can re-run the generator or one
      # gate to check a specific claim. Pinned to a commit for the same reason
      # as checkout: this job holds a token.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy Pillow fonttools

      # Same pinned, hash-checked font as ci.yml; see the note there.
      - name: Fetch Archivo (brand font used by the wordmark)
        env:
          FONT_URL: https://raw.githubusercontent.com/google/fonts/6c70c829f09ea345d3590406693220ea35c6553f/ofl/archivo/Archivo%5Bwdth,wght%5D.ttf
          FONT_SHA256: 0e094a7d3c7c4c25cf1310c4b30014f1dae9332220b1c2c88f4fa996f0b05053
        run: |
          mkdir -p ~/Library/Fonts
          F=~/Library/Fonts/Archivo-VariableFont_wdth,wght.ttf
          curl -fsSL -o "$F" "$FONT_URL"
          echo "$FONT_SHA256  $F" | sha256sum -c -

      # Checkout used persist-credentials: false. The action still `git fetch`es
      # the PR branch; without a credential on origin that fails with "could not
      # read Username". Re-attach the token only after setup has finished.
      - name: Allow Claude action to fetch the PR branch
        run: git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Likewise. This is `anthropics/claude-code-action` v1.0.233 (Claude Code
      # 2.1.281). Re-resolve the tag and update this line deliberately when
      # picking up a new version.
      - uses: anthropics/claude-code-action@8cf3482550831fb35a4fc3fbf7ca139cf8028b4c # v1.0.233
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Let the Cursor cloud agent's bot identity trigger this review. By
          # default the action refuses any bot-initiated run, which blocks
          # review on commits the agent pushes. Scoped to this one login on
          # purpose — never "*". The fork guard on this job's `if:` still holds.
          allowed_bots: "cursor[bot]"

          # Leaves a checklist comment that fills in as the review proceeds, so
          # a twelve-minute run shows its work instead of looking hung.
          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness and obvious defects.

            **The full CI suite already passed on this exact commit** — this
            review only starts when it is green. CI rebuilt every board with
            `src/make.py`, ran every verification gate, and confirmed the
            committed Gerbers are byte-identical to the rebuild. KiCad's own DRC
            was skipped (no kicad-cli in CI). Green means the gates pass, not
            that the change is right. Run
            `gh pr checks ${{ github.event.pull_request.number }}` and, where
            useful, `gh run view <run-id> --log` to read what CI actually did
            before you comment.

            **Check the pull request's description against the diff.** Every
            change in the diff should be something the description asks for,
            and everything the description claims should be in the diff.
            Unrelated changes riding along, or a claimed fix that isn't there,
            are findings.

            **You have a sandbox — use it to test, not just read.** This runner
            is a throwaway checkout of this commit with Python 3.12, numpy,
            Pillow, fontTools and the brand font installed. From a board's
            `src/` you can run `python make.py` or any single gate
            (`python drc.py`, `python netcheck.py`, `python verify_gerber.py`,
            …). You can also write throwaway probe scripts (Write/Edit) —
            e.g. to measure a clearance the change claims, or to try a rule at
            its boundary — and run them with `python`. Nothing you write is
            committed or pushed; it disappears with the runner. When a probe
            finds a real problem, put the input and the output in your comment,
            and say which claims you verified by running something rather than
            by reading.

            This repository is **open hardware**. Each top-level folder is one
            board. The design files are the Python scripts in each board's
            `src/`; the Gerbers, drill files, board file and 3D models are
            generated output, committed so a stranger can order a board without
            installing a toolchain.

            **Read the codebase, not just the diff.** The whole repository is
            checked out and you have read access to all of it. A diff read on
            its own produces shallow review: it cannot tell you whether a
            changed constant is duplicated somewhere that now disagrees,
            whether a verification gate already covers the case, or whether the
            change contradicts something already written down. Go and look
            before you comment.

            Worth reading for context:
            - the root `README.md` — the layout every board follows.
            - the board's own `README.md` — what it is, how to order it, and
              the assumptions the design rests on.
            - the board's `src/` — the generator, and the verification scripts
              that gate the build.

            What this repository cares about, in rough priority order:

            1. **Generated output must match its generator.** This is the
               central invariant here. A change to a script without
               regenerated outputs, or outputs that no script produces, means
               the committed Gerbers no longer describe the design — and
               somebody orders that. Treat a mismatch as a defect, not as
               untidiness.
            2. **Manufacturability.** Clearances, annular rings, drill sizes,
               slot handling, board outline, and anything that changes what a
               fab will actually make. A rule loosened without a stated reason
               is a finding. So is a change that no verification gate covers.
            3. **The ordering instructions being correct.** People spend money
               from these. A wrong file to upload, a wrong fab setting, or a
               part named too vaguely to actually buy costs a stranger real
               money and a two-week wait.
            4. **Documentation matching the board.** A README describing a
               revision the files no longer are is treated here as a defect.
               Figures that appear with no source behind them are a finding.
            5. **Secrets and configuration.** Flag any credential, token or key
               added to a tracked file, and any new sensitive file type that
               `.gitignore` does not already cover.

            Note that large generated files will appear in the diff. Do not
            review them line by line; check that they are consistent with the
            script changes that produced them, and say so briefly.

            Leave inline comments on the specific lines that need attention.
            Anchor each to the line it is about, say what goes wrong and under
            what conditions, and prefer one well-evidenced comment to five
            speculative ones. If you looked at something and it is fine, do not
            comment on it.

            Finish with a brief top-level summary: whether the change does what
            the description says, the findings that must be fixed before merge,
            and anything you verified yourself by running a script rather than
            by reading.

          # `--allowedTools`, camelCase, per the action's own examples. The
          # kebab-case spelling is silently not the flag it parses.
          #
          # Read-only on the repository, plus `python` for running the
          # generator, its gates and throwaway probe scripts, and Write/Edit for
          # those probes. Write/Edit cannot reach GitHub: no git commit or push
          # is allowed and the job token is read-only on contents, so anything
          # written dies with the runner. Still absent: `find`, `sed`, `cat` and
          # friends. `find -exec` runs arbitrary commands and `sed -i` writes
          # files, so an allowlist containing them is a shell in two disguises.
          # `gh api` is absent for the same reason — that verb takes POST and
          # DELETE. `Read`, `Grep` and `Glob` already do everything those tools
          # would be there for, and they cannot execute or write.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(python:*),Bash(python3:*),Read,Write,Edit,Grep,Glob,Bash(ls:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),Bash(git blame:*),Bash(git ls-files:*),Bash(git status:*)"
            --max-turns 120
            --model claude-opus-5-5
            --effort medium
