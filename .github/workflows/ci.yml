name: CI

# Rebuilds every board from its generator and checks the result against what is
# committed. The central invariant of this repository is that the committed
# Gerbers are exactly what the scripts in `src/` produce — someone orders from
# those files — so this is the check that matters most here.
on:
  push:
    branches: [main]
  # Pull requests do not trigger this file directly. `claude-code-review.yml`
  # calls it as its first job and only starts the Claude review once every job
  # here is green, so a PR runs this suite exactly once and a red suite stops
  # there — no paid review of a board that does not rebuild.
  workflow_call:
  # Manual runs (any branch), e.g. to check a board branch before its PR.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packet-logger-carrier-v1:
    # 2 vCPU: the org is on Blacksmith's free plan (3,000 2-vCPU minutes a
    # month; a 4-vCPU minute counts double). The router is single-threaded, so
    # more cores would not make this faster anyway.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The full build takes a little over two minutes on a fast laptop; this is
    # the backstop for a hung router, not an estimate.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packet-logger-carrier/v1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # `requirements.txt` lists numpy and Pillow; make.py also needs fontTools
      # (the wordmark is built from real Archivo glyph outlines), which the file
      # does not list. cadquery is only for `emit_step.py`, which make.py does
      # not run, so it is left out — it is a very large install.
      - name: Install dependencies
        run: pip install numpy Pillow fonttools

      # wordmark.py reads the brand font from `~/Library/Fonts/`, a macOS
      # path. On Linux `~` still expands, so the same file placed there works
      # without touching the generator. Pinned to a google/fonts commit and
      # checked against its hash, so a changed upstream font fails loudly
      # instead of quietly moving the silkscreen.
      - name: Fetch Archivo (brand font used by the wordmark)
        env:
          FONT_URL: https://raw.githubusercontent.com/google/fonts/6c70c829f09ea345d3590406693220ea35c6553f/ofl/archivo/Archivo%5Bwdth,wght%5D.ttf
          FONT_SHA256: 0e094a7d3c7c4c25cf1310c4b30014f1dae9332220b1c2c88f4fa996f0b05053
        run: |
          mkdir -p ~/Library/Fonts
          F=~/Library/Fonts/Archivo-VariableFont_wdth,wght.ttf
          curl -fsSL -o "$F" "$FONT_URL"
          echo "$FONT_SHA256  $F" | sha256sum -c -

      # Route, DRC, netlist, silkscreen, wordmark, KiCad emit, layer check,
      # Gerber emit and Gerber verify — every gate in make.py. Any failing gate
      # exits non-zero. KiCad's own DRC step is skipped here: make.py looks for
      # kicad-cli at its macOS path only and prints that it skipped.
      - name: Build and verify (make.py)
        working-directory: packet-logger-carrier/v1/src
        run: python make.py

      # The rebuilt Gerbers and drill files must be byte-identical to the ones
      # in the committed zip. A script change without regenerated outputs, or
      # outputs no script produces, fails here.
      - name: Committed Gerbers match the generator
        run: |
          mkdir -p /tmp/committed /tmp/rebuilt
          unzip -q packet-logger-carrier-gerbers.zip -d /tmp/committed
          unzip -q src/out/packet-logger-carrier-gerbers.zip -d /tmp/rebuilt
          if ! diff -r /tmp/committed /tmp/rebuilt; then
            echo "::error::Committed packet-logger-carrier-gerbers.zip does not match what src/make.py produces. Rebuild and commit the outputs."
            exit 1
          fi
          echo "Gerbers and drill files are byte-identical to the generator's output."

  ridge3-lite-v1:
    # Ridge 3 Lite (ridge3-lite/v1).  make.py needs KiCad's pcbnew module and
    # kicad-cli, so the job runs in the same official KiCad image the board's
    # toolchain pins (ridge3-lite/v1/tools/Dockerfile), by digest.  The routed
    # copper is the design of record (the last connection was finished by
    # hand), so routing is not re-run.  Everything after it is: the artwork
    # (silkscreen, logo, flag) from src/, then every gate and the fab files,
    # which must equal the committed ones.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user root
    defaults:
      run:
        working-directory: ridge3-lite/v1
    env:
      HOME: /tmp
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v7

      # The Python packages tools/Dockerfile installs that make.py and
      # verify.py use (KiKit is only for the panel, which --fab-only skips).
      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip git > /dev/null
          pip3 install --break-system-packages -q numpy shapely Pillow matplotlib pypdf \
            uharfbuzz fonttools pymupdf scipy
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Artwork from src/ (brand.py, silk.py), circuit gates, KiCad DRC
      # (0 / 0 / 0), net check, Gerbers, BOM, CPL.
      - name: Build artwork and fab files (make.py)
        run: python3 src/make.py --artwork --fab-only

      - name: Committed fab files match the build
        run: python3 tools/check_outputs.py

      # Firmware pin maps, parts, fab outputs, simulations' verdicts.
      - name: Design checks (verify.py)
        run: python3 src/verify.py

  canary-v1:
    # Canary (canary/v1). Routing is Freerouting's and not bit-for-bit
    # repeatable, so the committed canary.kicad_pcb is the design of record.
    # Everything else is rebuilt and gated by tools/ci.sh: the schematic is
    # regenerated from src/circuit.py and must equal the committed one (ERC 0,
    # netlist = circuit), DRC must be empty (all severities, schematic parity),
    # the fab files must equal the committed ones, the firmware pin map must
    # match, and the firmware must pass the hardware-in-the-loop scenarios
    # (simavr), the SPICE model and the analyses.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    container:
      image: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
      options: --user root
    defaults:
      run:
        working-directory: canary/v1
    env:
      HOME: /tmp
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-pip git gcc make pkg-config \
            gcc-avr avr-libc libelf-dev ngspice nodejs > /dev/null
          pip3 install --break-system-packages -q numpy matplotlib
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Gates, fab files, firmware and simulations (tools/ci.sh)
        run: tools/ci.sh
