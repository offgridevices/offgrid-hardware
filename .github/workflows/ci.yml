name: CI

# Rebuilds every product from its generator and checks the result against
# what is committed. The central invariant of this repository is that the
# committed fab files are exactly what the scripts in `src/` produce —
# someone orders from those files — so this is the check that matters most
# here.
#
# Each product carries its own CI in its `tools/` folder: `ci.json` (the
# pinned image, by digest, and the timeout), `ci-setup.sh` (what CI installs
# on that bare image) and `ci.sh` (every gate, from the product's folder; it
# runs the same locally with `tools/kd tools/ci.sh`). This file only picks
# the products (`tools/ci/matrix.py`) and runs them, so a new product adds
# its three files and nothing here changes.
#
# `ci-ok` is the one check that has to be green: it fails when any product
# or the repository checks failed or were cancelled, and passes when a pull
# request changes no product (a docs-only change builds no board).
on:
  push:
    branches: [main]
  # Pull requests do not trigger this file directly. `claude-code-review.yml`
  # calls it as its first job and only starts the Claude review once `ci-ok`
  # is green, so a PR runs this suite exactly once and a red suite stops
  # there — no paid review of a board that does not rebuild.
  workflow_call:
  # Every product, by hand (Actions tab, "Run workflow").
  workflow_dispatch:
  # Every product, weekly: catches what moves under a product nobody has
  # touched (an apt package, an unpinned pip package, a download).
  schedule:
    - cron: '17 6 * * 1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A newer push to a pull request replaces the older run; a run on main is
  # never cancelled, so every merged commit is checked.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  products:
    # Which products to build: on a pull request those whose folder changed
    # (all of them when a shared file — .github/, tools/, .gitignore —
    # changed); on every other event all of them.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      # Pinned to a commit rather than a tag, as in the other workflows: a
      # tag is mutable. This is `actions/checkout` v7.0.1. Depth 2: on a pull
      # request HEAD is GitHub's merge commit and HEAD^1 the base it merges
      # into, which is what matrix.py diffs against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
        run: python3 tools/ci/matrix.py

  repo-checks:
    # Every Markdown link resolves, every Python file parses, every product
    # has its three CI files. Seconds; runs on every event.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 tools/ci/check_repo.py

  build:
    needs: products
    if: needs.products.outputs.any == 'true'
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.products.outputs.matrix) }}
    # 2 vCPU: the org is on Blacksmith's free plan (3,000 2-vCPU minutes a
    # month; a 4-vCPU minute counts double). The routers and KiCad are
    # single-threaded, so more cores would not make this much faster anyway.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    # The backstop for a hung router or KiCad, not an estimate (ci.json).
    timeout-minutes: ${{ matrix.timeout }}
    container:
      image: ${{ matrix.image }}
      options: --user root
    env:
      HOME: /tmp
      PYTHONHASHSEED: '0'
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checkout belongs to the runner's user, the container runs as
      # root: without this git refuses the repository, and the gates that
      # compare against HEAD would fail.
      - name: Trust the checkout
        run: if command -v git > /dev/null; then git config --global --add safe.directory "$GITHUB_WORKSPACE"; fi

      - name: Install (tools/ci-setup.sh)
        run: tools/ci-setup.sh

      - name: Every gate (tools/ci.sh)
        run: tools/ci.sh

  ci-ok:
    # The single required check. `if: always()` so it reports even when a
    # job before it failed, and fails then; skipped (no product changed) is
    # a pass.
    needs: [products, repo-checks, build]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "products, repo-checks, build: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A CI job ended $r."; exit 1 ;; esac
          done
